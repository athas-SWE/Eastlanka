@if (products().length) {
  <div class="grid grid-cols-2 gap-3 sm:gap-5 lg:grid-cols-3">
    @for (product of products(); track product.code) {
      <app-product-card [product]="product" />
    }
  </div>
} @else {
  <p class="rounded-2xl border border-dashed border-navy/15 bg-white px-6 py-16 text-center text-muted">
    {{ emptyMessage() }}
  </p>
}
