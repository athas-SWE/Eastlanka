<a
  [href]="whatsappUrl"
  target="_blank"
  rel="noopener noreferrer"
  class="fixed z-50 hidden h-14 w-14 items-center justify-center rounded-full bg-whatsapp text-white shadow-lg shadow-navy/15 transition hover:scale-105 hover:bg-[#1ebe5d] lg:flex"
  style="right: max(1rem, env(safe-area-inset-right, 0px)); bottom: max(1rem, env(safe-area-inset-bottom, 0px))"
  aria-label="Chat on WhatsApp"
>
  <app-icon name="whatsapp" class="h-6 w-6 sm:h-7 sm:w-7" />
</a>
