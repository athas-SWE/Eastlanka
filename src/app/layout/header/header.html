<header class="sticky top-0 z-40 border-b border-forest/10 bg-cream/95 backdrop-blur">
  <div class="mx-auto flex max-w-6xl items-center justify-between gap-4 px-4 py-3 sm:px-6 lg:px-8">
    <a routerLink="/" class="flex items-center gap-3" (click)="closeMenu()">
      <img src="assets/logo.svg" alt="" class="h-10 w-10 rounded-xl" />
      <span>
        <span class="block font-display text-lg leading-none text-forest">{{ site.name }}</span>
        <span class="mt-1 hidden text-[11px] tracking-wide text-gold sm:block">{{ site.tagline }}</span>
      </span>
    </a>

    <nav class="hidden items-center gap-6 text-sm font-medium text-muted lg:flex">
      @for (link of links; track link.path) {
        <a
          [routerLink]="link.path"
          routerLinkActive="text-forest"
          class="hover:text-forest"
        >
          {{ link.label }}
        </a>
      }
    </nav>

    <div class="flex items-center gap-2">
      <a [href]="whatsappUrl" target="_blank" rel="noopener noreferrer" class="btn-whatsapp hidden sm:inline-flex">
        WhatsApp Us
      </a>
      <button
        type="button"
        class="inline-flex h-10 w-10 items-center justify-center rounded-full border border-forest/15 text-forest lg:hidden"
        (click)="toggleMenu()"
        [attr.aria-expanded]="menuOpen()"
        aria-label="Toggle menu"
      >
        @if (menuOpen()) {
          <span class="text-xl leading-none">×</span>
        } @else {
          <span class="text-lg leading-none">☰</span>
        }
      </button>
    </div>
  </div>

  @if (menuOpen()) {
    <nav class="border-t border-forest/10 bg-cream px-4 py-4 lg:hidden">
      <div class="flex flex-col gap-3 text-sm font-medium">
        @for (link of links; track link.path) {
          <a [routerLink]="link.path" routerLinkActive="text-forest" (click)="closeMenu()">
            {{ link.label }}
          </a>
        }
        <a [href]="whatsappUrl" target="_blank" rel="noopener noreferrer" class="btn-whatsapp w-full" (click)="closeMenu()">
          WhatsApp Us
        </a>
      </div>
    </nav>
  }
</header>
