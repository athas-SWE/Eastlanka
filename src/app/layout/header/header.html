<header class="sticky top-0 z-40 border-b border-navy/8 bg-white/90 backdrop-blur-md">
  <div class="mx-auto flex h-16 max-w-6xl items-center justify-between gap-6 px-4 sm:h-[4.5rem] sm:px-6 lg:px-8">
    <a routerLink="/" class="flex min-w-0 items-center gap-3" (click)="closeMenu()">
      <img
        [src]="site.logoImage | cloudinaryUrl:128"
        alt=""
        class="h-11 w-11 shrink-0 rounded-full bg-white object-cover ring-1 ring-navy/10"
      />
      <span class="brand-wordmark">
        <span class="text-navy">East</span>
        <span class="text-forest"> Lanka</span>
      </span>
    </a>

    <nav class="hidden items-center gap-7 text-[13px] font-medium text-muted lg:flex">
      @for (link of links; track link.path) {
        <a
          [routerLink]="link.path"
          routerLinkActive="text-navy"
          class="hover:text-navy"
        >
          {{ link.label }}
        </a>
      }
    </nav>

    <div class="flex items-center gap-2">
      <a [href]="whatsappUrl" target="_blank" rel="noopener noreferrer" class="btn-primary hidden sm:inline-flex">
        WhatsApp Us
      </a>
      <button
        type="button"
        class="inline-flex h-10 w-10 items-center justify-center rounded-full border border-navy/12 text-navy lg:hidden"
        (click)="toggleMenu()"
        [attr.aria-expanded]="menuOpen()"
        aria-label="Toggle menu"
      >
        @if (menuOpen()) {
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" class="h-5 w-5" fill="none" stroke="currentColor" stroke-width="1.8">
            <path stroke-linecap="round" d="M6 6l12 12M18 6L6 18" />
          </svg>
        } @else {
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" class="h-5 w-5" fill="none" stroke="currentColor" stroke-width="1.8">
            <path stroke-linecap="round" d="M4 7h16M4 12h16M4 17h16" />
          </svg>
        }
      </button>
    </div>
  </div>

  @if (menuOpen()) {
    <nav class="border-t border-navy/8 bg-white px-4 py-5 lg:hidden">
      <div class="flex flex-col gap-4 text-sm font-medium text-navy">
        @for (link of links; track link.path) {
          <a [routerLink]="link.path" routerLinkActive="text-forest" (click)="closeMenu()">
            {{ link.label }}
          </a>
        }
        <a [href]="whatsappUrl" target="_blank" rel="noopener noreferrer" class="btn-primary w-full" (click)="closeMenu()">
          WhatsApp Us
        </a>
      </div>
    </nav>
  }
</header>
