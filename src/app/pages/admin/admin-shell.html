<div class="border-b border-navy/8 bg-white">
  <div class="mx-auto flex max-w-6xl items-center justify-between gap-3 px-4 py-3 sm:px-6 lg:px-8">
    <nav class="flex min-w-0 flex-1 items-center gap-1 overflow-x-auto text-sm font-medium [-ms-overflow-style:none] [scrollbar-width:none] [&::-webkit-scrollbar]:hidden">
      @for (link of links; track link.path) {
        <a
          [routerLink]="link.path"
          [routerLinkActive]="['bg-navy', 'text-white']"
          [routerLinkActiveOptions]="{ exact: link.exact }"
          class="inline-flex shrink-0 items-center gap-1.5 rounded-full px-3 py-1.5 text-muted hover:bg-cream hover:text-navy"
        >
          <app-icon [name]="link.icon" class="h-3.5 w-3.5" />
          {{ link.label }}
        </a>
      }
    </nav>
    <button type="button" class="btn-quiet shrink-0 !px-3 !py-2 text-xs" (click)="signOut()">
      <app-icon name="logout" class="h-3.5 w-3.5" />
      Sign out
    </button>
  </div>
</div>
<router-outlet />
