<section class="section">
  <nav class="text-sm text-muted">
    <a routerLink="/categories" class="hover:text-forest">Categories</a>
    @if (category(); as cat) {
      <span class="mx-2">/</span>
      <span class="text-ink">{{ cat.name }}</span>
    }
  </nav>

  @if (category(); as cat) {
    <h1 class="section-title mt-6">{{ cat.name }}</h1>
    <p class="mt-3 max-w-2xl text-muted">{{ cat.blurb }}</p>
    <div class="section-rule"></div>
    <div class="mt-10">
      <app-product-grid [products]="products()" emptyMessage="No products in this category yet." />
    </div>
  } @else {
    <div class="mt-10 rounded-3xl border border-dashed border-forest/20 bg-white px-6 py-20 text-center">
      <h1 class="text-3xl text-forest">Category not found</h1>
      <a routerLink="/categories" class="btn-primary mt-6">All categories</a>
    </div>
  }
</section>
