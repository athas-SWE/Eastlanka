<section class="section">
  <nav class="text-sm text-muted">
    <a routerLink="/categories" class="hover:text-navy">Categories</a>
    @if (category(); as cat) {
      <span class="mx-2 text-navy/20">/</span>
      <span class="text-navy">{{ cat.name }}</span>
    }
  </nav>

  @if (category(); as cat) {
    <p class="eyebrow mt-6">Category</p>
    <h1 class="section-title mt-2">{{ cat.name }}</h1>
    <p class="section-copy">{{ cat.blurb }}</p>
    <div class="section-rule"></div>
    <div class="mt-10">
      <app-product-grid [products]="products()" emptyMessage="No products in this category yet." />
    </div>
  } @else {
    <div class="mt-10 rounded-3xl border border-dashed border-navy/15 bg-white px-6 py-20 text-center">
      <h1 class="text-3xl text-navy">Category not found</h1>
      <a routerLink="/categories" class="btn-primary mt-6">All categories</a>
    </div>
  }
</section>
