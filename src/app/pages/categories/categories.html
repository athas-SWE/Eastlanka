<section class="section">
  <h1 class="section-title">Categories</h1>
  <p class="mt-3 max-w-2xl text-muted">Electronics, fashion, home, accessories and gifts — pick a category and see what is in stock.</p>
  <div class="section-rule"></div>
  <div class="mt-10 grid gap-6 sm:grid-cols-2 lg:grid-cols-3">
    @for (category of categories; track category.slug) {
      <a
        [routerLink]="['/categories', category.slug]"
        class="overflow-hidden rounded-3xl border border-forest/10 bg-white transition hover:-translate-y-0.5 hover:border-gold"
      >
        <img [src]="category.image" [alt]="category.name" class="h-40 w-full object-cover" />
        <div class="p-6">
          <h2 class="font-display text-2xl text-forest">{{ category.name }}</h2>
          <p class="mt-2 text-sm text-muted">{{ category.blurb }}</p>
        </div>
      </a>
    }
  </div>
</section>
