<section class="section">
  <p class="eyebrow">Browse</p>
  <h1 class="section-title mt-2">Categories</h1>
  <p class="section-copy">Pick a category and see what is in stock right now.</p>
  <div class="section-rule"></div>
  <div class="mt-10 grid gap-6 sm:grid-cols-2 lg:grid-cols-3">
    @for (category of categories(); track category.slug) {
      <a
        [routerLink]="['/categories', category.slug]"
        class="soft-card overflow-hidden hover:-translate-y-0.5 hover:border-gold/40"
      >
        <img [src]="category.image | cloudinaryUrl:640" [alt]="category.name" class="h-44 w-full object-cover" />
        <div class="p-6">
          <h2 class="font-display text-2xl text-navy">{{ category.name }}</h2>
          <p class="mt-2 text-sm leading-6 text-muted">{{ category.blurb }}</p>
        </div>
      </a>
    }
  </div>
</section>
