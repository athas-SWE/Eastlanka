<section class="section">
  <h1 class="section-title">Products</h1>
  <p class="mt-3 max-w-2xl text-muted">Browse the full East Lanka catalogue. Filter by category or search by name and product code.</p>
  <div class="section-rule"></div>

  <div class="mt-8 flex flex-col gap-4 sm:flex-row">
    <label class="block flex-1">
      <span class="sr-only">Search products</span>
      <input
        type="search"
        class="w-full rounded-full border border-forest/15 bg-white px-5 py-3 text-sm outline-none focus:border-gold"
        placeholder="Search by name or code, e.g. EL-001"
        [value]="query()"
        (input)="onQuery($event)"
      />
    </label>
    <label class="sm:w-56">
      <span class="sr-only">Filter by category</span>
      <select
        class="w-full rounded-full border border-forest/15 bg-white px-5 py-3 text-sm outline-none focus:border-gold"
        [value]="category()"
        (change)="onCategory($event)"
      >
        <option value="">All categories</option>
        @for (item of categories; track item.slug) {
          <option [value]="item.slug">{{ item.name }}</option>
        }
      </select>
    </label>
  </div>

  <div class="mt-10">
    <app-product-grid [products]="filtered()" emptyMessage="No products match that search." />
  </div>
</section>
