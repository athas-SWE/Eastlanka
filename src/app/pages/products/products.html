<section class="section">
  <p class="eyebrow">Catalogue</p>
  <h1 class="section-title mt-2">Products</h1>
  <p class="section-copy">Browse the full East Lanka catalogue. Filter by category or search by name and product code.</p>
  <div class="section-rule"></div>

  <div class="mt-8 flex flex-col gap-3 sm:flex-row">
    <label class="block flex-1">
      <span class="sr-only">Search products</span>
      <input
        type="search"
        class="field"
        placeholder="Search by name or code, e.g. EL-001"
        [value]="query()"
        (input)="onQuery($event)"
      />
    </label>
    <label class="sm:w-56">
      <span class="sr-only">Filter by category</span>
      <select class="field" [value]="category()" (change)="onCategory($event)">
        <option value="">All categories</option>
        @for (item of categories(); track item.slug) {
          <option [value]="item.slug">{{ item.name }}</option>
        }
      </select>
    </label>
  </div>

  <p class="mt-6 text-sm text-muted">{{ filtered().length }} products</p>
  <div class="mt-6">
    <app-product-grid [products]="filtered()" emptyMessage="No products match that search." />
  </div>
</section>
